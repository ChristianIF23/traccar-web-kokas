<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Pantau KOKAS Fleet System</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-glow: rgba(37, 99, 235, 0.28);
        --bg-right: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
      }

      .split-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      /* ==========================================================================
         KOLOM KIRI: BRAND PANEL (CLEAN & GAGAH)
         ========================================================================== */
      .brand-panel {
        position: relative;
        width: 42%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 48px 56px;
        background:
          radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.25) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(30, 58, 138, 0.35) 0%, transparent 60%),
          linear-gradient(160deg, #1e3a8a 0%, #0f172a 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Grid Telemetri Halus */
      .telemetry-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 36px 36px;
        pointer-events: none;
      }

      /* Badge Status Atas */
      .status-pill {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        width: fit-content;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }

      /* Area Logo Tengah */
      .brand-center {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .traccar-logo-holder {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        color: #ffffff;
        margin-bottom: 12px;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.25));
      }

      .radar-icon-ring {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3.5px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .radar-icon-ring svg {
        width: 32px;
        height: 32px;
        fill: #ffffff;
      }

      .traccar-brand-text {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #ffffff;
      }

      .brand-subtext {
        font-size: 14px;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      /* Footer Kiri */
      .panel-footer {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
      }

      /* ==========================================================================
         KOLOM KANAN: FORM LOGIN (BERSIH & ELEGAN)
         ========================================================================== */
      .form-panel {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background-color: var(--bg-right);
        position: relative;
      }

      /* Options Bar Kanan Atas */
      .quick-options {
        position: absolute;
        top: 24px;
        right: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 30px;
        border: 1px solid var(--border-color);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      }

      .opt-btn {
        background: transparent;
        border: none;
        color: #475569;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 600;
        transition: color 0.15s;
      }
      .opt-btn:hover {
        color: var(--primary);
      }

      /* Card Login */
      .login-box {
        width: 100%;
        max-width: 410px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 42px 38px;
        box-shadow: 0 16px 36px -8px rgba(15, 23, 42, 0.06);
      }

      .login-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .login-header h1 {
        font-size: 26px;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: -0.025em;
        margin-bottom: 6px;
      }

      .login-header p {
        font-size: 13.5px;
        color: var(--text-muted);
        line-height: 1.45;
      }

      /* Form Fields */
      .form-container {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .input-group label {
        font-size: 12.5px;
        font-weight: 600;
        color: #334155;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper input {
        width: 100%;
        height: 44px;
        border: 1px solid rgba(15, 23, 42, 0.14);
        border-radius: 12px;
        padding: 0 14px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text-main);
        outline: none;
        background: #ffffff;
        transition: all 0.2s;
      }

      .input-wrapper input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      /* Tombol Mata Sandi */
      .btn-eye {
        position: absolute;
        right: 12px;
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      .btn-eye:hover {
        color: #475569;
      }

      /* Tombol Submit Tanpa Panah */
      .btn-login {
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        border: none;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px var(--primary-glow);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        margin-top: 6px;
      }

      .btn-login:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.38);
        transform: translateY(-1px);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      /* Footer Links */
      .bottom-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        padding: 0 2px;
      }

      .bottom-links a {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--primary);
        text-decoration: none;
        transition: color 0.15s;
      }

      .bottom-links a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        .brand-panel {
          display: none;
        }
        .form-panel {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="split-layout">
      <!-- KOLOM KIRI: IDENTITAS MURNI LOGO TRACCAR -->
      <aside class="brand-panel">
        <div class="telemetry-grid"></div>

        <div class="status-pill">
          <div class="status-dot"></div>
          <span>Fleet Server Online</span>
        </div>

        <div class="brand-center">
          <div class="traccar-logo-holder">
            <!-- Lingkaran Radar Khas Traccar -->
            <div class="radar-icon-ring">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="2.2" />
                <path
                  d="M14.8 9.2a4 4 0 0 1 0 5.6"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path
                  d="M17.6 6.4a8 8 0 0 1 0 11.2"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path d="M7 17a8 8 0 0 1 0-10l5 5z" />
              </svg>
            </div>
            <span class="traccar-brand-text">traccar</span>
          </div>
          <span class="brand-subtext">Pantau KOKAS Fleet Telematics System</span>
        </div>

        <div class="panel-footer">
          <span>Traccar v6.x Engine</span>
          <span>© Pantau KOKAS</span>
        </div>
      </aside>

      <!-- KOLOM KANAN: FORM LOGIN BERSIH & RAMPING -->
      <main class="form-panel">
        <!-- Quick Option Bar Kanan Atas -->
        <div class="quick-options">
          <button class="opt-btn" title="Scan QR Code">
            <svg
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
              />
            </svg>
          </button>
          <div style="width: 1px; height: 14px; background: rgba(15, 23, 42, 0.1)"></div>
          <button class="opt-btn">
            <span>Bahasa Indonesia</span>
            <svg
              width="12"
              height="12"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>

        <!-- Form Card -->
        <div class="login-box">
          <div class="login-header">
            <h1>Login</h1>
            <p>Silakan masuk ke akun Anda</p>
          </div>

          <form class="form-container" onsubmit="event.preventDefault()">
            <div class="input-group">
              <label>Email</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  value="anny@kokas.id"
                  placeholder="nama@kokas.id"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="input-group">
              <label>Password</label>
              <div class="input-wrapper">
                <input type="password" value="••••••••" placeholder="Masukkan password" required />
                <button type="button" class="btn-eye" title="Lihat password">
                  <svg
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-login">Login</button>

            <div class="bottom-links">
              <a href="#">Daftar Akun</a>
              <a href="#">Reset Password</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
